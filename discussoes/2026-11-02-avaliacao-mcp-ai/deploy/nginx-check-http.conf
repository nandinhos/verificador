# estágio 1 — apenas HTTP (necessário para o desafio ACME)
server {
    listen 80;
    listen [::]:80;
    server_name check.fssdev.com.br;

    root /var/www/check.fssdev.com.br;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/check.fssdev.com.br;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
