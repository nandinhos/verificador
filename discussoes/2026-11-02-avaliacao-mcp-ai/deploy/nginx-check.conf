# check.fssdev.com.br — relatório estático atrás da Cloudflare
server {
    listen 80;
    listen [::]:80;
    server_name check.fssdev.com.br;

    root /var/www/check.fssdev.com.br;
    index index.html;

    # ACME continua respondendo em HTTP
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/check.fssdev.com.br;
        default_type text/plain;
    }

    # redireciona só quando a requisição veio HTTPS pela Cloudflare.
    # (se a Cloudflare estiver em Flexible, o origin recebe HTTP e não entra em loop)
    if ($http_x_forwarded_proto = "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name check.fssdev.com.br;

    root /var/www/check.fssdev.com.br;
    index index.html;

    server_tokens off;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/check.fssdev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/check.fssdev.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---------- cabeçalhos de segurança ----------
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------- compressão ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # ---------- cache ----------
    # (usa expires em vez de add_header: add_header em location anula a herança
    #  dos cabeçalhos de segurança definidos no server)
    location = /index.html {
        expires -1;
    }
    location ^~ /assets/ {
        expires 30d;
    }
    location = /relatorio.pdf {
        expires 1d;
    }

    # ---------- bloqueios ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/check.fssdev.com.br_access.log;
    error_log  /var/log/nginx/check.fssdev.com.br_error.log warn;
}
